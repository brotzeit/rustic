name: Byte-compile

on: [push, pull_request]

jobs:
  byte-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          # 28.1 is the lowest version on which the current MELPA
          # dependency set still installs, even though rustic itself
          # declares Emacs 26.1 as its minimum.
          - '28.1'
          - '30.1'
          - snapshot
    steps:
      - uses: actions/checkout@v5

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install dependencies
        run: |
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(dolist (pkg '(rust-mode dash f let-alist markdown-mode project s seq spinner xterm-color)) \
                      (unless (package-installed-p pkg) (package-install pkg)))"

      - name: Byte-compile
        run: |
          files="rustic.el rustic-interaction.el rustic-compile.el \
            rustic-cargo.el rustic-clippy.el rustic-comint.el rustic-doc.el \
            rustic-expand.el rustic-lsp.el rustic-playground.el rustic-popup.el \
            rustic-racer.el rustic-rustfix.el rustic-rustfmt.el \
            rustic-babel.el rustic-spellcheck.el"
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(package-initialize)" \
            -L . \
            --eval "(setq byte-compile-error-on-warn nil)" \
            -f batch-byte-compile $files

      - name: Load
        run: |
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(package-initialize)" \
            -L . \
            --eval "(require 'rustic)" \
            --eval "(require 'rustic-cargo)" \
            --eval "(require 'rustic-rustfmt)" \
            --eval "(require 'rustic-babel)" \
            --eval "(require 'rustic-clippy)" \
            --eval "(require 'rustic-comint)" \
            --eval "(require 'rustic-doc)" \
            --eval "(require 'rustic-expand)" \
            --eval "(require 'rustic-interaction)" \
            --eval "(require 'rustic-lsp)" \
            --eval "(require 'rustic-playground)" \
            --eval "(require 'rustic-popup)" \
            --eval "(require 'rustic-racer)" \
            --eval "(require 'rustic-rustfix)" \
            --eval "(require 'rustic-spellcheck)"
